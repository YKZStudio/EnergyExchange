plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def target = providers.gradleProperty('minecraft_version').get()
if (!(target in ['26.1.2', '26.2'])) throw new GradleException("Unsupported Minecraft target: $target")
def profile = new Properties()
file("versions/$target.properties").withInputStream { profile.load(it) }
base.archivesName = "energyexchange-mc$target"

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

loom {
    splitEnvironmentSourceSets()
    mods { energyexchange { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${profile.fabric_api_version}"
    clientCompileOnly "com.terraformersmc:modmenu:${profile.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${profile.modmenu_version}"
    if (providers.gradleProperty('withTacz').isPresent()) runtimeOnly files('test-mods/tacz.jar')
    if (providers.gradleProperty('withBackpack').isPresent()) runtimeOnly files('test-mods/backpack.jar')
    if (providers.gradleProperty('withTacz').isPresent() || providers.gradleProperty('withBackpack').isPresent()) {
        runtimeOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${profile.forgeconfig_version}"
        runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${profile.cloth_version}"
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_target', target
    inputs.property 'fabric_api_version', profile.fabric_api_version
    inputs.property 'modmenu_version', profile.modmenu_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_target: target,
                fabric_api_version: profile.fabric_api_version, modmenu_version: profile.modmenu_version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
test { useJUnitPlatform() }
jar { from('licenses') { into 'META-INF/licenses' }; from('THIRD_PARTY_NOTICES.md'); from('LICENSE') { rename { "${it}_energyexchange" } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'energyexchange-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true // Automated disposable test server / 自动化临时测试服务器
    }
}

loom.runs.named('gameTest') {
    systemProperties.put('fabric-api.gametest.report-file', file('build/reports/gametest/results.xml').absolutePath)
}

// Version-specific bridges and price resources; gameplay logic stays shared.
sourceSets.client.java.srcDir("versions/$target/client")
sourceSets.main.resources.setSrcDirs(["versions/$target/resources", 'src/main/resources'])
