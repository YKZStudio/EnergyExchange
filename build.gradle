plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

loom {
    splitEnvironmentSourceSets()
    mods { energyexchange { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientCompileOnly 'com.terraformersmc:modmenu:20.0.2'
    clientRuntimeOnly 'com.terraformersmc:modmenu:20.0.2'
    if (providers.gradleProperty('withTacz').isPresent()) {
        runtimeOnly files('test-mods/tacz.jar')
        runtimeOnly 'fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1'
        runtimeOnly 'me.shedaniel.cloth:cloth-config-fabric:26.2.155'
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
test { useJUnitPlatform() }
jar { from('licenses') { into 'META-INF/licenses' }; from('THIRD_PARTY_NOTICES.md'); from('LICENSE') { rename { "${it}_energyexchange" } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'energyexchange-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true // Automated disposable test server / 自动化临时测试服务器
    }
}

loom.runs.named('gameTest') {
    systemProperties.put('fabric-api.gametest.report-file', file('build/reports/gametest/results.xml').absolutePath)
}
