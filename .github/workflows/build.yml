name: Build and test / 构建与测试
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
        mods: [vanilla, tacz, backpack, combined]
        include:
          - minecraft: '26.3'
            mods: vanilla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned integrations / 获取固定兼容模组
        env:
          MC_TARGET: ${{ matrix.minecraft }}
          MOD_PROFILE: ${{ matrix.mods }}
        run: |
          case "$MOD_PROFILE" in
            tacz) python tools/fetch_test_mods.py "$MC_TARGET" tacz ;;
            backpack) python tools/fetch_test_mods.py "$MC_TARGET" backpack ;;
            combined) python tools/fetch_test_mods.py "$MC_TARGET" tacz backpack ;;
          esac
      - name: Build and server tests / 构建及服务端测试
        env:
          MC_TARGET: ${{ matrix.minecraft }}
          MOD_PROFILE: ${{ matrix.mods }}
        run: |
          args=("-Pminecraft_version=$MC_TARGET" --no-daemon)
          case "$MOD_PROFILE" in
            vanilla) ./gradlew build "${args[@]}" ;;
            tacz) ./gradlew runGameTest -Ploader_version=0.19.5 -PwithTacz "${args[@]}" ;;
            backpack) ./gradlew runGameTest -Ploader_version=0.19.5 -PwithBackpack "${args[@]}" ;;
            combined) ./gradlew runGameTest -Ploader_version=0.19.5 -PwithTacz -PwithBackpack "${args[@]}" ;;
          esac
      - name: Install SDL software graphics / 安装 SDL 软件图形依赖
        if: matrix.minecraft == '26.3'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 mesa-vulkan-drivers
      - name: Client trading test / 客户端交易测试
        if: matrix.mods == 'vanilla'
        timeout-minutes: 8
        env:
          MC_TARGET: ${{ matrix.minecraft }}
        run: |
          if [[ "$MC_TARGET" == "26.3" ]]; then
            SDL_VIDEO_DRIVER=offscreen LIBGL_ALWAYS_SOFTWARE=1 ./gradlew runClientGameTest -Pminecraft_version="$MC_TARGET" --no-daemon --info
          else
            xvfb-run -a ./gradlew runClientGameTest -Pminecraft_version="$MC_TARGET" --no-daemon
          fi
          test -f build/run/clientGameTest/energyexchange-client-test-passed
      - uses: actions/upload-artifact@v4
        if: matrix.mods == 'vanilla'
        with:
          name: energyexchange-mc${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.minecraft }}-${{ matrix.mods }}
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: energyexchange-mc*
          merge-multiple: true
          path: release-artifacts
      - name: Publish release / 发布发行版
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping prerelease / 预发布不创建发行版"
            exit 0
          fi
          notes="docs/releases/$version.md"
          test -s "$notes"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists / 发行版已存在"
            exit 0
          fi
          jar261="release-artifacts/energyexchange-mc26.1.2-$version.jar"
          jar262="release-artifacts/energyexchange-mc26.2-$version.jar"
          jar263="release-artifacts/energyexchange-mc26.3-$version.jar"
          test -f "$jar261" && test -f "$jar262" && test -f "$jar263"
          gh release create "v$version" "$jar261" "$jar262" "$jar263" "$notes" \
            --target "$GITHUB_SHA" --title "Energy Exchange $version" --notes-file "$notes"
